en:
  terms:
    accept:
      title: "Accept Terms of Use"
      subtitle: "Before continuing, please confirm that you accept our Privacy Policy and Terms of Use."
      description_html: "To use EscolheAi, you must accept our %{privacy_link} and %{terms_link}."
      privacy_label: "Privacy Policy"
      terms_label: "Terms of Use"
      checkbox_label: "I confirm that I have read and accept the Privacy Policy and Terms of Use"
      submit_button: "Continue"

  legal:
    privacy:
      title: "Privacy Policy"
      updated: "Last updated"
      section_1:
        title: "1. Data Controller"
        body: "Data controller: Joana Dias. For data protection inquiries, contact: joana.jou@gmail.com"
      section_2:
        title: "2. Legal Basis for Processing"
        body: "We process your data based on: (a) contract performance (article 6(1)(b) GDPR), (b) your explicit consent (article 6(1)(a) GDPR), and (c) legitimate interest in maintaining security and operating the service (article 6(1)(f) GDPR)."
      section_3:
        title: "3. Personal Data Collected"
        intro: "We collect the following personal data:"
        item_1: "Identity data: email, encrypted password (for direct login) or name and profile picture (via Google OAuth)"
        item_2: "Preference data: movie rating history, personalized recommendations"
        item_3: "Technical data: IP address, browser type, access date/time, session cookies"
        item_4: "Optional data: preferred streaming platforms, display name, avatar"
      section_4:
        title: "4. Purpose of Processing"
        intro: "Your data is processed for:"
        item_1: "Secure authentication via email/password or Google OAuth"
        item_2: "Account management and security"
        item_3: "Delivery of personalized movie and series recommendations"
        item_4: "Legal compliance and regulatory requirements"
        item_5: "Security, fraud prevention and abuse protection"
      section_5:
        title: "5. Data Sharing with Third Parties"
        intro: "Your data is shared with the following processors:"
        item_1: "<strong>Google LLC</strong> (Google OAuth - optional) - only email and name for authentication"
        item_2: "<strong>The Movie Database (TMDB)</strong> - movie data only (does not receive personal data)"
        item_3: "<strong>Hetzner Online GmbH</strong> - infrastructure hosting (servers in Germany, EU)"
      section_6:
        title: "6. Data Subject Rights (GDPR)"
        intro: "You have the following rights under GDPR:"
        item_1: "Right of access: obtain a copy of your personal data"
        item_2: "Right of rectification: correct inaccurate or incomplete data"
        item_3: "Right of erasure (right to be forgotten): request deletion of your data"
        item_4: "Right to restrict processing: limit processing of your data"
        item_5: "Right to data portability: receive your data in a structured format"
        item_6: "Right to object: oppose processing in certain circumstances"
        extra: "To exercise any of these rights, contact: joana.jou@gmail.com"
      section_7:
        title: "7. Data Retention"
        body: "We retain your personal data only for as long as necessary to provide the service and comply with legal obligations. Upon account deletion request, your data is deleted within 30 days, except where retention is required by law. Audit data and security logs may be retained for up to 3 years."
      section_8:
        title: "8. Data Security"
        body: "We implement appropriate technical and organizational measures to protect your data, including: HTTPS encryption, bcrypt password encryption, role-based access control, continuous security monitoring and regular testing."
      section_9:
        title: "9. International Transfers"
        body: "Your data is processed on servers located in Germany (European Union). We do not transfer data outside the European Economic Area without explicit consent."
      section_10:
        title: "10. Cookies and Tracking"
        body: "We use only strictly necessary cookies to maintain your login session. We do not use tracking, analytics or advertising cookies."
      section_11:
        title: "11. Contact and Complaints"
        body: "For privacy inquiries: joana.jou@gmail.com. If you believe your GDPR rights have been violated, you may file a complaint with the data protection authority in your jurisdiction."
      section_12:
        title: "12. Changes to This Policy"
        body: "We may update this policy periodically. Significant changes will be communicated via email with 30 days notice."

    terms:
      title: "Terms of Use"
      updated: "Last updated"
      section_1:
        title: "1. About the Service"
        body: "Escolhe Ai is a free AI-powered movie and series recommendation platform developed for the Brazilian streaming market. By creating an account and using the service, you agree to be bound by these Terms of Use."
      section_2:
        title: "2. Eligibility and Account"
        body: "You must be at least 13 years old to use this service. If you are a minor, you must have parental or guardian consent. You are responsible for maintaining the confidentiality of your password and for all activities on your account."
      section_3:
        title: "3. Authentication"
        body: "You can log in in two ways: (a) using email and password, or (b) using Google OAuth. For email/password login, you must provide an active email address. For Google OAuth, your authentication data is managed by Google according to their terms."
      section_4:
        title: "4. Acceptable Use"
        intro: "You agree to use this service only for legitimate purposes and not to:"
        item_1: "Attempt to access, modify or damage the service infrastructure"
        item_2: "Use the service for illegal, fraudulent or harmful purposes"
        item_3: "Engage in harassment, abuse or discrimination against other users"
        item_4: "Automate access or use bots without explicit authorization"
        item_5: "Share your password or credentials with third parties"
      section_5:
        title: "5. Third-Party Content"
        body: "Movie information is provided by TMDB (The Movie Database) and subject to their terms of service. EscolheAi is not responsible for the accuracy, integrity or legality of that data."
      section_6:
        title: "6. Intellectual Property"
        body: "All content of EscolheAi, including algorithms, design, recommendations and code, is protected by copyright and intellectual property rights. You may not reproduce, distribute, modify or reuse without explicit authorization."
      section_7:
        title: "7. Availability and Maintenance"
        body: "The service is provided as is, without guarantees of continuous availability. We perform regular maintenance and updates that may cause temporary interruptions. We are not responsible for losses resulting from service unavailability."
      section_8:
        title: "8. Limitation of Liability"
        body: "To the maximum extent permitted by law, EscolheAi is not liable for indirect, incidental, special or consequential damages arising from your use of or inability to use the service, even if advised of the possibility of such damages."
      section_9:
        title: "9. Account Termination"
        body: "You may terminate your account at any time from your profile page by clicking the 'Terminate Account' button. Upon confirmation, your account will be immediately deleted. After 30 days, your personal data will be completely deleted from our systems. We may suspend or terminate accounts that violate these terms or applicable law."
      section_10:
        title: "10. Governing Law and Jurisdiction"
        body: "These terms are governed by Brazilian law. Users in the European Union have additional rights under GDPR and European consumer protection law. For disputes, you may resort to the courts of your jurisdiction or alternative dispute resolution measures."
