version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: escolhe_ai_db
    environment:
      POSTGRES_USER: escolhe_ai
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: escolhe_ai_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escolhe_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: escolhe_ai_web
    command: >
      sh -c "
        bundle exec rails db:prepare &&
        bundle exec rails server -b 0.0.0.0 -p 3000
      "
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://escolhe_ai:dev_password@db:5432/escolhe_ai_development
      RAILS_LOG_TO_STDOUT: "true"
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  bundle:
