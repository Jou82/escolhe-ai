<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Escolhe AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* Variáveis de cor extraídas da sua imagem */
        :root {
            --bg-dark: #020617;
            --bg-glow: #0f172a;
            --accent-blue: #60a5fa;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
        }

        .error-page {
            /* O degradê radial azul marinho profundo da sua Home */
            background: radial-gradient(circle at center, var(--bg-glow) 0%, var(--bg-dark) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            text-align: center;
            position: relative;
            padding: 2rem;
        }

        /* Grid Overlay igual à Home */
        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(96, 165, 250, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(96, 165, 250, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle, black, transparent 80%);
            -webkit-mask-image: radial-gradient(circle, black, transparent 80%);
            pointer-events: none;
        }

        .error-container {
            position: relative;
            z-index: 10;
            max-width: 500px;
        }

        .error-code {
            font-size: clamp(5rem, 15vw, 8rem);
            font-weight: 800;
            line-height: 1;
            margin-bottom: 1rem;
            letter-spacing: -3px;
            /* Gradiente branco para azul da logo/título */
            background: linear-gradient(180deg, #ffffff 30%, var(--accent-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(96, 165, 250, 0.2));
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        p {
            font-family: 'Work Sans', sans-serif;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* Botão estilizado como o campo de busca da Home */
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 0.8rem 2rem;
            background: rgba(15, 23, 42, 0.5);
            color: var(--accent-blue);
            border: 1px solid rgba(96, 165, 250, 0.3);
            font-weight: 700;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .btn-home:hover {
            background: rgba(96, 165, 250, 0.1);
            border-color: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(96, 165, 250, 0.2);
        }

        /* Cartas decorativas inferiores */
        .error-cards {
            display: flex;
            gap: 15px;
            margin-top: 4rem;
            position: relative;
            z-index: 5;
        }

        .card-mini {
            width: 55px;
            height: 80px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-mini svg {
            color: rgba(96, 165, 250, 0.4);
        }

        .card-mini:nth-child(1) { transform: rotate(-8deg) translateY(10px); }
        .card-mini:nth-child(2) { transform: translateY(-5px); border-color: rgba(96, 165, 250, 0.2); }
        .card-mini:nth-child(3) { transform: rotate(8deg) translateY(10px); }

        @media (max-width: 480px) {
            .error-code { font-size: 5rem; }
            h2 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <main class="error-page">
        <div class="grid-overlay"></div>

        <div class="error-container">
            <h1 class="error-code">404</h1>
            <h2>Ops! Filme não encontrado.</h2>
            <p>
                Parece que essa página saiu de cartaz ou nunca chegou a estrear.
                Que tal voltar ao início e encontrar algo novo?
            </p>

            <a href="/" class="btn-home">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6"/>
                </svg>
                Voltar para a Home
            </a>
        </div>

            </div>

            </div>
