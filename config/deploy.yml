service: escolhe_ai

image: jou82/escolhe_ai

servers:
  web:
    hosts:
      - 188.245.192.222
    options:
      add-host: host.docker.internal:host-gateway

registry:
  server: docker.io
  username: jou82
  password:
    - DOCKERHUB_PASSWORD

builder:
  arch: amd64

env:
  clear:
    RAILS_ENV: production
  secret:
    - RAILS_MASTER_KEY
    - RAILS_ENV
    - DATABASE_URL
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
