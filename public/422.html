<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>422 - Erro de Processamento | Escolhe AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #020617; --bg-glow: #0f172a; --accent-blue: #60a5fa; --text-muted: #94a3b8; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-dark); }
        .error-page { background: radial-gradient(circle at center, var(--bg-glow) 0%, var(--bg-dark) 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; color: #ffffff; text-align: center; position: relative; padding: 2rem; }
        .grid-overlay { position: absolute; inset: 0; background-image: linear-gradient(rgba(96, 165, 250, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(96, 165, 250, 0.03) 1px, transparent 1px); background-size: 60px 60px; mask-image: radial-gradient(circle, black, transparent 80%); -webkit-mask-image: radial-gradient(circle, black, transparent 80%); pointer-events: none; }
        .error-container { position: relative; z-index: 10; max-width: 550px; }
        .error-code { font-size: clamp(5rem, 15vw, 8rem); font-weight: 800; line-height: 1; margin-bottom: 1rem; letter-spacing: -3px; background: linear-gradient(180deg, #ffffff 30%, var(--accent-blue) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 20px rgba(96, 165, 250, 0.2)); }
        h2 { font-size: 1.8rem; margin-bottom: 1rem; font-weight: 700; }
        p { font-family: 'Work Sans', sans-serif; color: var(--text-muted); line-height: 1.6; margin-bottom: 2.5rem; }
        .btn-home { display: inline-flex; align-items: center; gap: 12px; padding: 0.8rem 2rem; background: rgba(15, 23, 42, 0.5); color: var(--accent-blue); border: 1px solid rgba(96, 165, 250, 0.3); font-weight: 700; border-radius: 12px; text-decoration: none; transition: all 0.3s ease; backdrop-filter: blur(8px); }
        .btn-home:hover { background: rgba(96, 165, 250, 0.1); border-color: var(--accent-blue); transform: translateY(-2px); box-shadow: 0 5px 20px rgba(96, 165, 250, 0.2); }
        .btn-home:hover svg { transform: rotate(180deg); transition: transform 0.5s ease; }
        .error-cards { display: flex; gap: 15px; margin-top: 4rem; position: relative; z-index: 5; }
        .card-mini { width: 55px; height: 80px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .card-mini svg { color: rgba(96, 165, 250, 0.4); }
        .card-mini:nth-child(1) { transform: rotate(-8deg) translateY(10px); }
        .card-mini:nth-child(2) { transform: translateY(-5px); border-color: rgba(96, 165, 250, 0.2); }
        .card-mini:nth-child(3) { transform: rotate(8deg) translateY(10px); }
    </style>
</head>
<body>
    <main class="error-page">
        <div class="grid-overlay"></div>
        <div class="error-container">
            <h1 class="error-code">422</h1>
            <h2>Dados não processáveis.</h2>
            <p>Entendemos o seu pedido, mas não conseguimos processar os dados enviados no momento. Tente recarregar a página.</p>
            <a href="/" class="btn-home">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
                </svg>
                Tentar novamente
            </a>
        </div>
        <div class="error-cards">
            <div class="card-mini"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
            <div class="card-mini"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
            <div class="card-mini"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div>
        </div>
    </main>
</body>
</html>
